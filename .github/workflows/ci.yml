name: MRE

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  via-tinyexec:
    name: via-tinyexec ${{ matrix.scenario }} · ${{ matrix.os }} · node-${{ matrix.node }} · tinyexec-${{ matrix.tinyexec.label }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24, 26]
        tinyexec:
          - {label: '1.1.2', spec: '1.1.2'}
          - {label: '1.2.2', spec: '1.2.2'}
          - {label: '1.2.3', spec: '1.2.3'}
          - {label: 'fix-branch', spec: 'github:Mearman/tinyexec#fix/buffer-drain-race'}
        scenario: [deadlock, data-loss, data-loss-iterator, data-loss-concurrent]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Pin tinyexec ${{ matrix.tinyexec.label }}
        run: node scripts/set-tinyexec-version.mjs
        env:
          MRE_TINYEXEC_VERSION: ${{ matrix.tinyexec.spec }}
      - name: Install
        working-directory: via-tinyexec
        run: npm install --no-fund --no-audit
      - name: Resolved tinyexec
        working-directory: via-tinyexec
        run: node -p "require('./node_modules/tinyexec/package.json').version"
      - name: Run ${{ matrix.scenario }}
        working-directory: via-tinyexec
        run: npm run test:${{ matrix.scenario }}

  via-lint-staged:
    name: via-lint-staged · ${{ matrix.os }} · node-${{ matrix.node }} · tinyexec-${{ matrix.tinyexec }} · ls-${{ matrix.lint_staged }} · task=${{ matrix.task.name }}
    strategy:
      fail-fast: false
      matrix:
        # lint-staged@17.0.4 requires Node >=22.22.1; 16.4.0 supports older Node.
        # The session log shows the wild-repo hang on lint-staged 16.4.0 + Node 26,
        # so test both versions to surface the differential.
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [22, 24, 26]
        tinyexec: ['1.1.2', '1.2.2', '1.2.3']
        lint_staged: ['16.4.0', '17.0.4']
        task:
          - {name: npm, cmd: 'eslint --cache --fix'}
          - {name: pnpm, cmd: 'pnpm exec eslint --cache --fix'}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - uses: pnpm/action-setup@v4
        if: matrix.task.name == 'pnpm'
        with:
          version: 10
      - name: Pin tinyexec ${{ matrix.tinyexec }}
        run: node scripts/set-tinyexec-version.mjs
        env:
          MRE_TINYEXEC_VERSION: ${{ matrix.tinyexec }}
      - name: Pin lint-staged ${{ matrix.lint_staged }}
        working-directory: via-lint-staged
        run: |
          node -e "const fs=require('fs');const p=JSON.parse(fs.readFileSync('package.json','utf8'));p.dependencies['lint-staged']=process.env.LS_VER;fs.writeFileSync('package.json',JSON.stringify(p,null,2)+'\n')"
        env:
          LS_VER: ${{ matrix.lint_staged }}
      - name: Install
        working-directory: via-lint-staged
        run: npm install --no-fund --no-audit
      - name: Resolved versions
        working-directory: via-lint-staged
        run: |
          node -p "'tinyexec ' + require('./node_modules/tinyexec/package.json').version"
          node -p "'lint-staged ' + require('./node_modules/lint-staged/package.json').version"
      - name: Reproduce
        working-directory: via-lint-staged
        run: npm test
        env:
          MRE_LINT_STAGED_CMD: ${{ matrix.task.cmd }}

  via-husky:
    name: via-husky · ${{ matrix.os }} · node-${{ matrix.node }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node: [20, 22, 24, 26]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
      - name: Configure git identity
        run: |
          git config --global user.email "mre@example.com"
          git config --global user.name "MRE"
      - name: Run hook-stdin probe
        working-directory: via-husky
        run: npm test
        shell: bash
